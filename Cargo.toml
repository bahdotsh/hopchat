[package]
name = "hopchat"
version = "0.2.0"
edition = "2024"
description = "Offline terminal chat over an Offline Protocol mesh: no internet, no server"
license = "MIT"
homepage = "https://github.com/bahdotsh/hopchat"
repository = "https://github.com/bahdotsh/hopchat"
keywords = ["chat", "tui", "offline", "mesh", "mls"]
categories = ["command-line-utilities"]

[package.metadata.deb]
maintainer = "bahdotsh <appu.yess@gmail.com>"
copyright = "2026, bahdotsh <appu.yess@gmail.com>"
license-file = ["LICENSE", "0"]
# $auto reads the real shared-library deps (libc6, libssl3) from the binary.
depends = "$auto"
extended-description = """Offline, end-to-end encrypted terminal chat for your local network. No server, no internet, no accounts."""
section = "net"
priority = "optional"
assets = [
  ["target/release/hopchat", "usr/bin/", "755"],
  ["packaging/hopchat.1", "usr/share/man/man1/", "644"],
  ["packaging/hopchat.desktop", "usr/share/applications/", "644"],
  ["packaging/hopchat.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/hopchat", dest = "/usr/bin/hopchat", mode = "755" },
  { source = "packaging/hopchat.1", dest = "/usr/share/man/man1/hopchat.1", mode = "644" },
  { source = "packaging/hopchat.desktop", dest = "/usr/share/applications/hopchat.desktop", mode = "644" },
  { source = "packaging/hopchat.svg", dest = "/usr/share/icons/hicolor/scalable/apps/hopchat.svg", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/licenses/hopchat/LICENSE", mode = "644", doc = true },
]

[features]
# Compile OpenSSL into the binary instead of linking the system's libssl.
# Release tarballs and the AppImage use it so they run without OpenSSL 3;
# the .deb, .rpm and AUR packages keep the system library and its updates.
# Only has an effect on Linux: macOS TLS goes through Security.framework.
vendored-openssl = ["native-tls/vendored"]

[dependencies]
getrandom = "0.4.3"
offline-protocol = { version = "0.30.0", default-features = false, features = ["file-store"] }
offline-protocol-core = "0.30.0"
offline-protocol-mls = "0.30.0"
offline-protocol-transport = "0.30.0"
ratatui = "0.30.2"
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.10.9", features = ["oid"] }
unicode-width = "0.2.2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
mdns-sd = "0.21.6"
aes = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
crc32fast = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["sha2"] }
x509-cert = { version = "0.2.5", features = ["builder", "hazmat"] }

# RSA key generation for Android TV pairing takes seconds unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3
